---
build:
  image: node:26.10.0
  stage: build
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
  before_script:
    - command -v pnpm || npm install --global pnpm@12.9.1
    - pnpm config set store-dir .pnpm-store
    - pnpm install
  script:
    - pnpm test
    - pnpm lint
    - pnpm build
  artifacts:
    paths:
      - dist/

.deploy:
  image: alpine:latest
  stage: deploy
  dependencies:
    - build
  script:
    - apk add openssl openssh-client rsync
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - > /dev/null
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
    - rsync -e 'ssh -p2201' --compress --delete '--exclude=assets/satzkatalog*.txt' --recursive --verbose dist/ $SFTP_SERVER

deploy to development:
  extends: .deploy
  dependencies:
    - build
  environment:
    name: development
  only:
    - master

deploy to development:manual:
  extends: .deploy
  dependencies:
    - build
  environment:
    name: development
  when: manual

deploy to production:
  extends: .deploy
  dependencies:
    - build
  environment:
    name: production
  only:
    - tags
  when: manual
